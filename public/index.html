<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; min-height: 100vh; }
        
        /* App Container */
        .app-container { width: 100%; max-width: 450px; background: #fff; min-height: 100vh; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding-bottom: 70px; }
        
        /* Header */
        header { background: #4a90e2; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; }
        .points-badge { background: #ff9800; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        /* Screens */
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        
        /* Form Inputs */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        
        /* Buttons */
        .btn { width: 100%; padding: 12px; background: #4a90e2; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn:active { background: #357abd; }
        
        /* Navigation Bar */
        nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: #fff; display: flex; justify-content: space-around; border-top: 1px solid #eee; padding: 10px 0; }
        .nav-item { text-align: center; color: #777; font-size: 12px; cursor: pointer; text-decoration: none; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: #4a90e2; }
        
        /* Splash Screen */
        #splash-screen { position: fixed; inset: 0; background: #4a90e2; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 85%; max-width: 350px; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <i class="fa-solid fa-coins" style="font-size: 50px; margin-bottom: 15px;"></i>
        <h2>Reward Zone</h2>
        <p>Loading app...</p>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- App Header -->
        <header>
            <div class="user-info">
                <div class="avatar" id="user-avatar"></div>
                <div>
                    <h4 id="user-name">Guest User</h4>
                    <small id="user-uid">UID: -----</small>
                </div>
            </div>
            <div class="points-badge">
                <i class="fa-solid fa-wallet"></i> <span id="user-points">0</span> Coins
            </div>
        </header>

        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <h3>Daily Rewards</h3>
            <div style="background: #eef5ff; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;">
                <p>Claim daily check-in bonus!</p>
                <button class="btn" onclick="claimDailyBonus()" style="margin-top: 10px;">Claim 50 Coins</button>
            </div>

            <h3>Refer & Earn</h3>
            <div style="background: #fdf6ec; padding: 15px; border-radius: 8px; margin: 15px 0;">
                <p>Share your UID with friends to earn extra coins.</p>
                <button class="btn" style="background: #ff9800; margin-top: 10px;" onclick="copyReferral()">Copy Referral Code</button>
            </div>
        </div>

        <!-- Wallet / Withdrawal Screen -->
        <div id="wallet-screen" class="screen">
            <h3>Withdraw Points</h3>
            <form id="withdraw-form" onsubmit="handleWithdraw(event)">
                <div class="input-group">
                    <label>Select Payment Method</label>
                    <select id="withdraw-method">
                        <option value="UPI">UPI ID</option>
                        <option value="Bank">Bank Transfer</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Account / UPI Details</label>
                    <input type="text" id="withdraw-details" placeholder="Enter UPI ID or Account Details" required>
                </div>
                <div class="input-group">
                    <label>Coins to Withdraw</label>
                    <input type="number" id="withdraw-amount" placeholder="Minimum 1000 Coins" min="1000" required>
                </div>
                <button type="submit" class="btn">Request Withdrawal</button>
            </form>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav>
            <div class="nav-item active" onclick="switchScreen('home-screen', this)">
                <i class="fa-solid fa-house"></i> Home
            </div>
            <div class="nav-item" onclick="switchScreen('wallet-screen', this)">
                <i class="fa-solid fa-wallet"></i> Wallet
            </div>
        </nav>
    </div>

    <!-- JavaScript logic -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
            }, 1500);
        });

        function switchScreen(screenId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(screenId).classList.add('active');
            element.classList.add('active');
        }

        function claimDailyBonus() {
            let pts = document.getElementById('user-points');
            pts.innerText = parseInt(pts.innerText) + 50;
            alert('Congratulations! 50 Coins added to your wallet.');
        }

        function copyReferral() {
            navigator.clipboard.writeText("My Referral Code: REWARD123");
            alert("Referral code copied to clipboard!");
        }

        function handleWithdraw(e) {
            e.preventDefault();
            const amount = document.getElementById('withdraw-amount').value;
            alert(`Withdrawal request of ${amount} coins submitted successfully!`);
        }
    </script>
</body>
</html>
