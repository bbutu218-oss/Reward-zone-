<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Deep 3D Shadow & Effects -->
        <filter id="deep-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
        </filter>

        <!-- Background Gradient -->
        <linearGradient id="baseGrad" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#673ab7"/>
            <stop offset="50%" stop-color="#512da8"/>
            <stop offset="100%" stop-color="#311b92"/>
        </linearGradient>

        <!-- Rich Gold Gradient for Text & Elements -->
        <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff5cc"/>
            <stop offset="30%" stop-color="#f3e0aa"/>
            <stop offset="60%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#8c6710"/>
        </linearGradient>

        <!-- Orbit Ring Gradient -->
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c4dff"/>
            <stop offset="50%" stop-color="#512da8"/>
            <stop offset="100%" stop-color="#3f51b5"/>
        </linearGradient>

        <!-- 3D Sphere Radial Gradient -->
        <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#fffae6"/>
            <stop offset="35%" stop-color="#f6d365"/>
            <stop offset="70%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#7a550c"/>
        </radialGradient>
    </defs>

    <!-- App Icon Base with Rounded 3D Edges -->
    <rect x="40" y="40" width="420" height="420" rx="100" ry="100" fill="url(#baseGrad)" filter="url(#deep-shadow)"/>
    <rect x="44" y="44" width="412" height="412" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

    <!-- Orbit Ring -->
    <circle cx="250" cy="245" r="145" fill="none" stroke="url(#ringGrad)" stroke-width="16" filter="url(#deep-shadow)"/>

    <!-- 3D Extrusion Shadow & Main RZ Text -->
    <text x="250" y="222" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="115" font-weight="900" fill="#5a410a" text-anchor="middle" letter-spacing="-3" transform="translate(0, 4)">RZ</text>
    <text x="250" y="222" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="115" font-weight="900" fill="url(#goldTextGrad)" text-anchor="middle" letter-spacing="-3" filter="url(#deep-shadow)">RZ</text>

    <!-- 3D Extrusion Shadow & Main zone Text -->
    <text x="250" y="292" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="62" font-weight="800" fill="#5a410a" text-anchor="middle" letter-spacing="2" transform="translate(0, 3)">zone</text>
    <text x="250" y="292" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#goldTextGrad)" text-anchor="middle" letter-spacing="2" filter="url(#deep-shadow)">zone</text>

    <!-- 3D Rocket Element -->
    <g transform="translate(250, 365) rotate(-35)" filter="url(#deep-shadow)">
        <path d="M0,-35 C13,-18 13,18 0,38 C-13,18 -13,-18 0,-35 Z" fill="url(#goldTextGrad)"/>
        <circle cx="0" cy="-2" r="5.5" fill="#311b92"/>
        <path d="M-11,16 L-24,26 L-11,26 Z" fill="url(#goldTextGrad)"/>
        <path d="M11,16 L24,26 L11,26 Z" fill="url(#goldTextGrad)"/>
        <path d="M-6,38 C0,52 0,52 0,62 C0,52 0,52 6,38 Z" fill="#ff9800"/>
    </g>

    <!-- 3D Golden Ball on Ring -->
    <circle cx="355" cy="140" r="32" fill="url(#ballGrad)" filter="url(#deep-shadow)"/>
</svg>
